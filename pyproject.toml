[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "llm-interview-prep"
version = "0.1.0"
description = "A bilingual LLM interview prep repository with coding problems, public tests, and mock rounds."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110.0",
  "pydantic>=2.7.0",
  "pytest>=8.0.0",
  "torch>=2.2.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_prep"]

