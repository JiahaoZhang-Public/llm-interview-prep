[pytest]
addopts = --import-mode=importlib
pythonpath = src
testpaths = tracks tests
markers =
  smoke: repository smoke tests
  practice: problem-level practice tests
  top10: top-frequency problems
  mock: mock interview packs
  transformer: transformer fundamentals
  tokenization: tokenizer problems
  inference: inference optimization problems
  training: training and finetuning problems
  rag: retrieval augmented generation problems
  agent: agent and tool use problems
  systems: AI systems engineering problems
  difficulty_1: easiest difficulty level
  difficulty_2: basic difficulty level
  difficulty_3: medium difficulty level
  difficulty_4: advanced difficulty level
  difficulty_5: hardest difficulty level
